[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "sigrix-launcher"
version = "0.1.1"
description = "Start a Sigrix-delivered MCP server you bought from the MCP client you already use: checks the purchase, fetches and verifies the package, installs it and hands over stdio."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "Sigrix" }]
keywords = ["mcp", "model-context-protocol", "sigrix", "postern", "claude-code"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
# The purchase check and the verified download are the Postern runner's own
# client code, from `sigrix-runtime` (sigrix-io/sigrix-runtime). It has no
# dependencies of its own, so a `uvx` start, which happens on every client
# start, still installs nothing beyond the two packages.
#
# Pinned exactly, not to the minor its VERSIONING.md suggests for code built
# on it: the launcher calls helpers in its `pull` module that no version
# promise covers. A runtime release reaches buyers through a launcher release
# whose tests ran against it, as it did while the launcher carried a copy.
dependencies = ["sigrix-runtime==0.1.0"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy==2.3.1",
]

[project.scripts]
sigrix-launcher = "sigrix_launcher.cli:main"

[project.urls]
Homepage = "https://github.com/sigrix-io/sigrix-launcher"
Issues = "https://github.com/sigrix-io/sigrix-launcher/issues"
Changelog = "https://github.com/sigrix-io/sigrix-launcher/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/sigrix_launcher"]

[tool.hatch.build.targets.sdist]
include = ["src/sigrix_launcher", "tests", "README.md", "LICENSE", "NOTICE", "CHANGELOG.md"]
# The pin guard reads .github/workflows, which the sdist does not carry: it
# checks the repository, not the package.
exclude = ["tests/test_workflow_pins.py"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# S105 and S108 are the fixtures' fake token and fake cache path, which
# name nothing real.
"tests/*" = ["S101", "S105", "S108", "S603", "S607"]
"src/sigrix_launcher/installer.py" = ["S603"]

# py.typed ships in the wheel, which tells every consumer's type checker to
# trust these annotations, so they are checked as strictly as the other Sigrix
# packages check theirs.
[tool.mypy]
strict = true
python_version = "3.11"
files = ["src/sigrix_launcher"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
