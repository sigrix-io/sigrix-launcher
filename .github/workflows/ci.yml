name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      # The real-start test builds an environment with venv and pip here,
      # because this runner has no uv; a buyer starting it with uvx has uv.
      - name: Test
        run: pytest -q
      - name: The console script answers
        run: sigrix-launcher --version
