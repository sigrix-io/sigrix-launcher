name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      # Checks out, installs the Python and pip-installs `-e .[dev]`, with the
      # upstream actions pinned once in sigrix-io/actions rather than here.
      - uses: sigrix-io/actions/setup-python-project@765103f1c9d89e019dcaea72a78eed2577b30ae1 # v1.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Lint
        run: ruff check . && ruff format --check .
      # The real-start test builds an environment with venv and pip here,
      # because this runner has no uv; a buyer starting it with uvx has uv.
      - name: Test
        run: pytest -q
      - name: The console script answers
        run: sigrix-launcher --version

  # The aggregate gate. One check to require on main, so adding a job above
  # does not mean editing the branch ruleset to match.
  ci-passed:
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded
        run: |
          echo '${{ toJSON(needs) }}'
          [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "false" ]
