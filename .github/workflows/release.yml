name: Release

# Trusted publishing: PyPI trusts this repository's `release.yml` in the
# `pypi` environment, so no API token is stored anywhere and nothing here
# reads a secret. Both sides of that trust have to exist before the first
# tag — the publisher on PyPI and the environment in this repository's
# settings. VERSIONING.md § Releasing has the two of them.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# Never cancelled: a run cancelled mid-upload can leave a release half-landed,
# and a PyPI version number can never be reused.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # A fork can push a tag to itself; it must not build what this
    # repository's trust policy would then be asked to publish.
    if: github.repository == 'sigrix-io/sigrix-launcher'
    steps:
      - uses: sigrix-io/actions/setup-python-project@765103f1c9d89e019dcaea72a78eed2577b30ae1 # v1.0.0
        with:
          python-version: "3.12"
          install: build
      - name: Build sdist and wheel
        run: python -m build
      - name: The tag matches the package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v$version"; exit 1; }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
